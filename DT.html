<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Today — In-Person Money Transfer & Airline Ticket Booking, Bolton</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

  /* =========================================================
     TOKENS
  ========================================================= */
  :root{
    --midnight:       #0F172A;
    --midnight-soft:  #1B2740;
    --midnight-softer:#2A3A5C;
    --gold:           #F59E0B;
    --gold-light:     #FCD34D;
    --gold-dim:       #FDE9C4;
    --paper:          #F8FAFC;
    --paper-dim:      #EEF2F8;
    --slate:          #64748B;
    --slate-light:    #94A3B8;
    --mint:           #14B8A6;
    --border:         rgba(15,23,42,0.09);
    --border-inverse: rgba(248,250,252,0.14);
    --shadow-lg: 0 24px 48px -12px rgba(15,23,42,0.22);
    --shadow-md: 0 12px 24px -8px rgba(15,23,42,0.14);
    --shadow-sm: 0 4px 10px -2px rgba(15,23,42,0.08);
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --font-display: 'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-body: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
    --ease: all 0.3s ease;
    --container: 1180px;
  }

  /* =========================================================
     RESET
  ========================================================= */
  *,*::before,*::after{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    font-family:var(--font-body);
    color:var(--midnight);
    background:var(--paper);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img,svg{ display:block; max-width:100%; }
  a{ color:inherit; text-decoration:none; }
  ul{ list-style:none; margin:0; padding:0; }
  button, input, select{ font-family:inherit; font-size:inherit; color:inherit; }
  h1,h2,h3,h4{ font-family:var(--font-display); margin:0; line-height:1.12; letter-spacing:-0.01em; }
  p{ margin:0; }
  :focus-visible{ outline:2.5px solid var(--gold); outline-offset:3px; border-radius:4px; }

  .container{
    width:100%;
    max-width:var(--container);
    margin-inline:auto;
    padding-inline:20px;
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:var(--font-mono);
    font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--gold);
    font-weight:500;
  }
  .eyebrow::before{
    content:''; width:16px; height:1.5px; background:var(--gold);
  }
  .section-head{ max-width:640px; margin-bottom:44px; }
  .section-head h2{ font-size:clamp(1.7rem,3.6vw,2.4rem); margin-top:14px; }
  .section-head p{ color:var(--slate); font-size:1.02rem; margin-top:14px; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 26px;
    border-radius:100px;
    border:1.5px solid transparent;
    font-weight:600; font-size:0.96rem;
    cursor:pointer;
    transition:var(--ease);
    white-space:nowrap;
  }
  .btn-gold{
    background:var(--gold); color:var(--midnight);
    box-shadow:0 10px 22px -8px rgba(245,158,11,0.55);
  }
  .btn-gold:hover{ background:var(--gold-light); transform:translateY(-2px); box-shadow:0 14px 28px -8px rgba(245,158,11,0.65); }
  .btn-ghost-dark{
    background:transparent; border-color:var(--border-inverse); color:var(--paper);
  }
  .btn-ghost-dark:hover{ background:rgba(248,250,252,0.08); border-color:rgba(248,250,252,0.32); }
  .btn-outline{
    background:transparent; border-color:var(--border); color:var(--midnight);
  }
  .btn-outline:hover{ border-color:var(--midnight); background:var(--midnight); color:var(--paper); }
  .btn-block{ width:100%; }

  /* =========================================================
     NAVBAR
  ========================================================= */
  .navbar{
    position:sticky; top:0; z-index:100;
    background:rgba(248,250,252,0.86);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .navbar-inner{
    display:flex; align-items:center; justify-content:space-between;
    height:72px;
  }
  .logo{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-display); font-weight:700; font-size:1.28rem;
    color:var(--midnight);
  }
  .logo-mark{ width:34px; height:34px; flex-shrink:0; }
  .nav-links{
    display:none;
    align-items:center; gap:34px;
    font-weight:500; font-size:0.95rem;
    color:var(--midnight-soft);
  }
  .nav-links a{ position:relative; padding:6px 0; transition:var(--ease); }
  .nav-links a:hover{ color:var(--gold); }
  .nav-links a::after{
    content:''; position:absolute; left:0; right:0; bottom:-2px; height:2px;
    background:var(--gold); transform:scaleX(0); transform-origin:left;
    transition:var(--ease);
  }
  .nav-links a:hover::after{ transform:scaleX(1); }
  .nav-right{ display:flex; align-items:center; gap:18px; }
  .nav-cta{ display:none; }
  .nav-toggle{
    display:flex; align-items:center; justify-content:center;
    width:40px; height:40px; border-radius:10px;
    background:none; border:1.5px solid var(--border); cursor:pointer;
  }
  .nav-toggle svg{ width:19px; height:19px; }
  .mobile-menu{
    display:none;
    flex-direction:column;
    gap:2px;
    background:var(--paper);
    border-bottom:1px solid var(--border);
    padding:8px 20px 18px;
  }
  .mobile-menu.open{ display:flex; }
  .mobile-menu a{
    padding:13px 4px; font-weight:500; border-bottom:1px solid var(--border);
    color:var(--midnight-soft);
  }
  .mobile-menu .btn{ margin-top:14px; }

  @media (min-width:900px){
    .nav-links{ display:flex; }
    .nav-cta{ display:inline-flex; }
    .nav-toggle{ display:none; }
    .mobile-menu{ display:none !important; }
  }

  /* =========================================================
     HERO
  ========================================================= */
  .hero{
    background:
      radial-gradient(ellipse 700px 420px at 88% -8%, rgba(245,158,11,0.16), transparent 60%),
      var(--midnight);
    color:var(--paper);
    padding:56px 0 88px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:'';
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(248,250,252,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(248,250,252,0.045) 1px, transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(ellipse 900px 500px at 20% 10%, black, transparent 75%);
    pointer-events:none;
  }
  .hero-grid{
    position:relative; z-index:1;
    display:grid;
    gap:48px;
    align-items:center;
  }
  .hero-copy h1{
    font-size:clamp(2.1rem,5.6vw,3.35rem);
    margin-top:18px;
    max-width:15ch;
  }
  .hero-copy h1 em{
    font-style:normal; color:var(--gold-light);
  }
  .hero-copy p{
    margin-top:20px;
    font-size:1.08rem;
    color:var(--slate-light);
    max-width:46ch;
  }
  .hero-actions{ display:flex; flex-wrap:wrap; gap:14px; margin-top:32px; }
  .hero-trustrow{
    display:flex; flex-wrap:wrap; gap:22px;
    margin-top:40px; padding-top:28px;
    border-top:1px solid var(--border-inverse);
  }
  .hero-trust-item{
    display:flex; align-items:center; gap:9px;
    font-size:0.86rem; color:var(--slate-light); font-weight:500;
  }
  .hero-trust-item svg{ width:18px; height:18px; color:var(--gold); flex-shrink:0; }

  /* Hero card */
  .hero-card-wrap{ position:relative; z-index:1; }
  .hero-card{
    background:var(--paper);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
    overflow:hidden;
    color:var(--midnight);
    max-width:460px;
    margin-inline:auto;
  }
  .tab-bar{
    display:flex;
    background:var(--paper-dim);
    padding:6px;
    gap:6px;
  }
  .tab-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:12px 10px;
    border:none; background:transparent;
    font-weight:600; font-size:0.9rem; border-radius:var(--radius-md);
    cursor:pointer; color:var(--slate); transition:var(--ease);
  }
  .tab-btn.active{
    background:var(--paper); color:var(--midnight);
    box-shadow:var(--shadow-sm);
  }
  .tab-btn svg{ width:16px; height:16px; }
  
  .card-body{ padding:28px; }
  .tab-content{ display:none; }
  .tab-content.active{ display:block; }
  
  .office-status{
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 10px; background:rgba(20,184,166,0.12);
    color:var(--mint); border-radius:100px; font-size:0.8rem; font-weight:600;
    margin-bottom:14px;
  }
  .card-address{ font-family:var(--font-display); font-size:1.35rem; font-weight:700; margin-bottom:8px; }
  .card-hours{ font-size:0.92rem; color:var(--slate); margin-bottom:24px; display:grid; gap:4px;}
  .card-hours span{ display:flex; justify-content:space-between; }

  @media (min-width:900px){
    .hero-grid{ grid-template-columns: 1.1fr 0.9fr; gap:64px; }
  }

  /* =========================================================
     SERVICES SECTION
  ========================================================= */
  .services{ padding:100px 0; background:var(--paper); }
  .services-grid{ display:grid; gap:32px; }
  .service-card{
    background:var(--paper); border:1px solid var(--border);
    border-radius:var(--radius-lg); padding:40px;
    box-shadow:var(--shadow-sm); transition:var(--ease);
    display:flex; flex-direction:column; justify-content:between;
  }
  .service-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-md); border-color:var(--midnight-softer); }
  .service-icon{
    width:52px; height:52px; background:var(--midnight); color:var(--gold);
    border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center;
